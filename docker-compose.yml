services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: thesis
      POSTGRES_PASSWORD: thesis
      POSTGRES_DB: thesis
    ports:
      - "45432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thesis -d thesis"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    image: node:22-slim
    working_dir: /app
    command: sh -c "[ -d node_modules ] || npm ci; npm run dev -- --host 0.0.0.0"
    environment:
      DATABASE_URL: postgresql://thesis:thesis@postgres:5432/thesis
      JWT_SECRET: dev-only-insecure-secret-change-me
      API_KEY: dev-key
      ANALYST_NAME: analyst
    volumes:
      - ./web:/app
    ports:
      - "5173:5173"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:

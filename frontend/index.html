<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Investment Thesis Platform</title>
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("theme");
        if (saved === "light" || saved === "dark") {
          document.documentElement.setAttribute("data-theme", saved);
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Space+Grotesk:wght@400;500;700&display=swap">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg: { DEFAULT: 'var(--bg)', ink: 'var(--bg-ink)' },
            surface: { DEFAULT: 'var(--surface)', 2: 'var(--surface-2)', 3: 'var(--surface-3)' },
            border: 'var(--border)',
            fg: 'var(--fg)',
            'muted-fg': 'var(--muted-fg)',
            white: 'var(--white)',
            accent: { DEFAULT: 'var(--accent)', 2: 'var(--accent-2)', 3: 'var(--accent-3)', 4: 'var(--accent-4)', ink: 'var(--accent-ink)' },
            good: 'var(--good)',
            ok: 'var(--ok)',
            warn: 'var(--warn)',
            danger: 'var(--danger)',
          },
          fontFamily: {
            sans: ['Space Grotesk', 'Segoe UI', 'sans-serif'],
            mono: ['JetBrains Mono', 'Consolas', 'monospace'],
          },
        },
      },
    };
  </script>
  <style>
    :root {
      --bg: #050505;
      --bg-ink: #000000;
      --surface: #121212;
      --surface-2: #0a0a0a;
      --surface-3: #1a1a1a;
      --border: #333333;
      --fg: #f0f0f0;
      --muted-fg: #888888;
      --white: #ffffff;
      --accent: #ccff00;
      --accent-2: #00f0ff;
      --accent-3: #ff003c;
      --accent-4: #ffaa00;
      --accent-ink: #050505;
      --good: #ccff00;
      --ok: #00f0ff;
      --warn: #ffaa00;
      --danger: #ff003c;
      color-scheme: dark;
    }
    * { scrollbar-color: var(--border) var(--bg); }
    input, select, textarea {
      background: var(--surface-2);
      color: var(--fg);
      border-color: var(--border);
    }
    input::placeholder, textarea::placeholder { color: var(--muted-fg); }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(204, 255, 0, 0.25);
    }
    .nav-tab {
      font-size: 0.875rem;
      font-weight: 500;
      padding: 0.4rem 0.75rem;
      border-radius: 0.375rem;
      color: var(--muted-fg);
    }
    .nav-tab:hover { color: var(--fg); background: var(--surface-3); }
    .nav-tab.active { color: var(--fg); background: var(--surface-2); }
    .facet-chip {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.75rem;
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      border: 1px solid var(--border);
      color: var(--muted-fg);
      cursor: pointer;
      user-select: none;
    }
    .facet-chip:hover { color: var(--fg); border-color: var(--muted-fg); }
    .facet-chip:has(:checked) { color: var(--fg); background: var(--surface-3); border-color: var(--fg); }
    .facet-chip:has(:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
    .facet-chip input { position: absolute; opacity: 0; width: 1px; height: 1px; }
    .drawer-jump {
      color: var(--muted-fg);
      font-weight: 500;
      white-space: nowrap;
      padding: 0.2rem 0;
      border-bottom: 2px solid transparent;
    }
    .drawer-jump:hover { color: var(--fg); }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        --bg: #ffffff;
        --bg-ink: #ffffff;
        --surface: #ffffff;
        --surface-2: #f7f7f7;
        --surface-3: #eeeeee;
        --border: #d8d8d8;
        --fg: #0a0a0a;
        --muted-fg: #5c5c5c;
        color-scheme: light;
      }
    }
    :root[data-theme="light"] {
      --bg: #ffffff;
      --bg-ink: #ffffff;
      --surface: #ffffff;
      --surface-2: #f7f7f7;
      --surface-3: #eeeeee;
      --border: #d8d8d8;
      --fg: #0a0a0a;
      --muted-fg: #5c5c5c;
      color-scheme: light;
    }
    :root[data-theme="dark"] {
      --bg: #050505;
      --bg-ink: #000000;
      --surface: #121212;
      --surface-2: #0a0a0a;
      --surface-3: #1a1a1a;
      --border: #333333;
      --fg: #f0f0f0;
      --muted-fg: #888888;
      color-scheme: dark;
    }
  </style>
</head>
<body class="font-sans bg-bg text-fg min-h-screen">
  <!-- Login gate: shown until a session (JWT) or dev API key is present -->
  <div id="login-overlay" class="hidden fixed inset-0 bg-bg z-50 flex items-center justify-center p-4">
    <div class="bg-bg-ink rounded-xl shadow-md border border-border w-full max-w-sm p-6">
      <h1 class="font-semibold text-lg mb-1">Investment Thesis Platform</h1>
      <p class="text-sm text-muted-fg mb-4">Sign in to continue.</p>
      <div id="login-error" class="hidden mb-3 rounded-md bg-danger/10 border border-danger/30 p-2 text-sm text-danger"></div>
      <label class="block text-sm mb-2">Email
        <input id="login-email" type="email" class="mt-1 w-full rounded-md border border-border px-2 py-1.5 text-sm" />
      </label>
      <label class="block text-sm mb-4">Password
        <input id="login-password" type="password" class="mt-1 w-full rounded-md border border-border px-2 py-1.5 text-sm" />
      </label>
      <button id="login-submit" class="w-full text-sm px-3 py-2 rounded-md bg-accent text-accent-ink hover:brightness-90">Sign in</button>
      <details class="mt-4 text-xs text-muted-fg">
        <summary class="cursor-pointer">Use an API key instead</summary>
        <div class="mt-2 flex gap-2">
          <input id="login-api-key" placeholder="X-API-Key" class="flex-1 rounded-md border border-border px-2 py-1 text-sm" />
          <button id="login-api-key-submit" class="text-xs px-2 py-1 rounded-md border border-border hover:bg-surface-3">Use key</button>
        </div>
      </details>
    </div>
  </div>

  <header class="bg-bg-ink border-b border-border sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 h-14 flex items-center gap-6">
      <h1 class="font-semibold text-base shrink-0">Investment Thesis Platform</h1>
      <nav class="flex items-center gap-1">
        <button id="nav-companies" data-nav="cards" class="nav-tab">Companies</button>
        <button id="nav-review-queue" data-nav="review" class="nav-tab">Review Queue</button>
        <button id="nav-guidance" data-nav="guidance" class="nav-tab">Guidance</button>
      </nav>
      <div class="flex-1"></div>
      <div class="flex items-center gap-2">
        <button id="nav-export" class="text-sm px-3 py-1.5 rounded-md border border-border hover:bg-surface-3">Export</button>
        <button id="nav-new-company" class="text-sm px-3 py-1.5 rounded-md bg-accent text-accent-ink hover:brightness-90">+ New Company</button>
      </div>
      <div class="flex items-center gap-3 pl-3 ml-1 border-l border-border shrink-0">
        <button id="theme-toggle" class="text-xs px-2 py-1 rounded-md border border-border hover:bg-surface-3"></button>
        <span id="session-badge" class="text-xs text-muted-fg hidden md:inline"></span>
        <button id="nav-sign-out" class="text-xs px-2 py-1 rounded-md hover:bg-surface-3 text-muted-fg hover:text-fg">Sign out</button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-5">
    <div id="header-stats"></div>
    <div id="facet-bar"></div>
    <div id="main-panel">
      <div id="cards-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
      <div id="review-queue-view" class="hidden"></div>
      <div id="guidance-view" class="hidden"></div>
    </div>
  </main>

  <!-- Full-page company create/amend editor - not a popup, replaces the whole viewport -->
  <!-- Deliberately below #modal-overlay (z-50) - modals (table builder, edit
       columns, etc.) are opened from within this page and must render above
       it. Never needs to beat #drawer either: openIngestPage() always calls
       closeDrawer() first, so the two are never simultaneously visible. -->
  <div id="ingest-page" class="hidden fixed inset-0 z-30 bg-bg flex flex-col"></div>

  <!-- Drawer (company detail) -->
  <div id="drawer-overlay" class="hidden fixed inset-0 bg-black/30 z-40"></div>
  <aside id="drawer" class="hidden fixed top-0 right-0 h-full w-full sm:w-[520px] bg-bg-ink shadow-xl z-50"></aside>

  <!-- Generic centered modal (ingest / observations / health-check / ai-review / export) -->
  <div id="modal-overlay" class="hidden fixed inset-0 bg-black/30 z-50 flex items-center justify-center p-4">
    <div id="modal-panel" class="bg-bg-ink rounded-xl shadow-xl w-full max-w-2xl flex flex-col"></div>
  </div>

  <div id="toast" class="hidden fixed bottom-4 right-4 z-50 rounded-md px-4 py-2 text-sm shadow-lg"></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
